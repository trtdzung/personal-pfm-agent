services:
  personal-card-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-card-agent-server
    container_name: personal-card-agent
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your environment or .env file}
      SERVER_API_KEY: ${SERVER_API_KEY:?Set SERVER_API_KEY in your environment or .env file}
      MEMORY_ID: ${MEMORY_ID:?Set MEMORY_ID (create one with `gab memory create`) in your environment or .env file}
      USER_PREFERENCE_STRATEGY_ID: ${USER_PREFERENCE_STRATEGY_ID:?Set USER_PREFERENCE_STRATEGY_ID (a USER_PREFERENCE long-term memory strategy on MEMORY_ID) in your environment or .env file}
      # Only needed to run locally -- GreenNode AgentBase Runtime injects these
      # automatically for you when deployed there.
      GREENNODE_CLIENT_ID: ${GREENNODE_CLIENT_ID:-}
      GREENNODE_CLIENT_SECRET: ${GREENNODE_CLIENT_SECRET:-}
      PORT: ${PORT:-8080}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT', '8080') + '/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
