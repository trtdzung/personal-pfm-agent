[project]
name = "research-assistant"
version = "0.1.0"
description = "Managed Deep Agents quickstart: a minimal research-assistant deep agent."
requires-python = ">=3.11"
dependencies = [
    "managed-deepagents",
    "langchain",
]

[project.optional-dependencies]
notebook = [
    "deepagents",
    "langgraph-sdk",
    "python-dotenv",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools", "middleware"]
