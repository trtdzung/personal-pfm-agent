[project]
name = "personal-card-agent"
version = "0.1.0"
description = "Managed Deep Agents personal financial assistant for card customers: transaction stats, spending insights, and financial advice from a customer's card data."
requires-python = ">=3.11"
dependencies = [
    "managed-deepagents",
    "langchain",
    "deepagents",
]

[project.optional-dependencies]
notebook = [
    "deepagents",
    "langgraph-sdk",
    "langchain-openai",
    "python-dotenv",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["middleware"]

[tool.hatch.build.targets.wheel.force-include]
"data/customers/CIF_0001.json" = "data/customers/CIF_0001.json"
"data/customers/CIF_0002.json" = "data/customers/CIF_0002.json"
"data/customers/CIF_0003.json" = "data/customers/CIF_0003.json"
"data/customers/CIF_0004.json" = "data/customers/CIF_0004.json"
