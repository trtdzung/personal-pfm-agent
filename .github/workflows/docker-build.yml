name: docker-build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies + test deps
        run: pip install -r requirements.txt pytest httpx
      - name: Run server tests
        env:
          OPENAI_API_KEY: sk-ci-dummy
        run: pytest tests/test_server.py tests/test_text_utils.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          SHA_TAG="ghcr.io/${{ github.repository_owner }}/personal-card-agent:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ghcr.io/${{ github.repository_owner }}/personal-card-agent:latest
      - name: Smoke test image
        run: |
          docker run -d --name smoketest -p 18000:8000 \
            -e OPENAI_API_KEY=sk-ci-dummy \
            -e SERVER_API_KEY=ci-dummy \
            ${{ steps.tags.outputs.sha_tag }}
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:18000/health; then
              break
            fi
            sleep 2
          done
          curl -f http://localhost:18000/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs smoketest || true
      - name: Clean up smoke test container
        if: always()
        run: docker rm -f smoketest || true
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.tags.outputs.sha_tag }}
          docker push ghcr.io/${{ github.repository_owner }}/personal-card-agent:latest
