name: docker-build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies + test deps
        run: pip install -r requirements.txt pytest httpx
      - name: Run server tests
        env:
          AI_PLATFORM_API_KEY: sk-ci-dummy
        run: python -m pytest tests/test_server.py tests/test_text_utils.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: tags
        run: |
          SHA_TAG="vcr.vngcloud.vn/111480-abp114564/pca-agent:sha-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            vcr.vngcloud.vn/111480-abp114564/pca-agent:latest
      - name: Smoke test image
        run: |
          docker run -d --name smoketest -p 18080:8080 \
            -e AI_PLATFORM_API_KEY=sk-ci-dummy \
            -e SERVER_API_KEY=ci-dummy \
            -e MEMORY_ID=ci-dummy-memory-id \
            -e USER_PREFERENCE_STRATEGY_ID=ci-dummy-strategy-id \
            ${{ steps.tags.outputs.sha_tag }}
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:18080/health; then
              break
            fi
            sleep 2
          done
          curl -f http://localhost:18080/health
      - name: Show container logs on failure
        if: failure()
        run: docker logs smoketest || true
      - name: Clean up smoke test container
        if: always()
        run: docker rm -f smoketest || true
      - name: Log in to vcr.vngcloud.vn
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: vcr.vngcloud.vn
          username: ${{ secrets.VCR_USERNAME }}
          password: ${{ secrets.VCR_PASSWORD }}
      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.tags.outputs.sha_tag }}
          docker push vcr.vngcloud.vn/111480-abp114564/pca-agent:latest
